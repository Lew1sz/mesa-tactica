<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><title>Mesa Táctica v0.4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:#edf6fb;font-family:system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none} .chip{background:#162b3be8;border:1px solid #365469;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:750;box-shadow:0 3px 12px #0003}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;display:grid;gap:10px;pointer-events:none}#info{background:#152b3beb;border:1px solid #36566b;border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.45}#hint{color:#b6ced9;font-size:11px;margin-top:3px}#buttons{display:flex;gap:10px}button{pointer-events:auto;flex:1;border:1px solid #688497;background:#2b4659;color:#fff;border-radius:12px;padding:13px 8px;font-size:14px;font-weight:750}button.primary{background:#137c76}#loading{position:fixed;inset:0;background:#101923;display:grid;place-items:center;text-align:center;padding:25px;z-index:20}#loading>div{max-width:380px}#loading h2{margin-bottom:8px}#loading p{line-height:1.5;color:#b5ccd8}#loading button{width:100%}#status{font-size:12px;color:#9cb9c9;margin-top:8px}#error{color:#ffc2a4;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div id="stage"></div><div id="top"><div class="chip">⚔ Mesa Táctica · v0.4</div><div id="turn" class="chip">Turno: Azul</div></div><div id="bottom"><div id="info"><span id="message">Selecciona una miniatura azul para comenzar.</span><div id="hint">Tocar: seleccionar/mover · Arrastrar: girar · Dos dedos: zoom</div></div><div id="buttons"><button id="reset">Reiniciar</button><button class="primary" id="end">Terminar turno</button></div></div><div id="loading"><div><h2>⚔ Mesa Táctica 3D</h2><p id="loadText">Preparando tablero tridimensional…</p><p id="error"></p><button id="retry" style="display:none" onclick="location.reload()">Reintentar</button><div id="status">Se requiere conexión a internet para cargar el motor 3D.</div></div></div><script>
(function(){'use strict';const loading=document.getElementById('loading'),loadText=document.getElementById('loadText'),error=document.getElementById('error');function fail(t){loadText.textContent='No se pudo iniciar el motor 3D.';error.textContent=t;document.getElementById('retry').style.display='block'}window.addEventListener('error',e=>{if(loading.style.display!=='none')fail(e.message||'Error de JavaScript')});const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js';s.onload=()=>{try{start()}catch(e){fail(e.stack||e.message)}};s.onerror=()=>fail('No se pudo descargar Three.js. Revisa la conexión y vuelve a intentarlo.');document.head.appendChild(s);
function start(){const T=window.THREE;if(!T)throw Error('Three.js no está disponible');const stage=document.getElementById('stage'),scene=new T.Scene();scene.background=new T.Color(0x101923);scene.fog=new T.Fog(0x101923,29,57);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,110);const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'default'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xc6e2ff,0x4b4138,2.3));const sun=new T.DirectionalLight(0xffead2,2.7);sun.position.set(-9,17,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
const mats={ground:new T.MeshStandardMaterial({color:0x4e6359,roughness:1}),edge:new T.MeshStandardMaterial({color:0x263b3e,roughness:1}),grid:new T.LineBasicMaterial({color:0x82948a,transparent:true,opacity:.26}),stone:new T.MeshStandardMaterial({color:0x858985,roughness:1}),stoneDark:new T.MeshStandardMaterial({color:0x555e60,roughness:1}),metal:new T.MeshStandardMaterial({color:0x283640,metalness:.55,roughness:.5}),gold:new T.MeshStandardMaterial({color:0xc7a46a,metalness:.6,roughness:.35}),visor:new T.MeshStandardMaterial({color:0x83e8ef,emissive:0x12516c,emissiveIntensity:.65}),base:new T.MeshStandardMaterial({color:0x202b32,metalness:.4,roughness:.65}),blue:new T.MeshStandardMaterial({color:0x287fc3,metalness:.35,roughness:.48}),red:new T.MeshStandardMaterial({color:0xc6544d,metalness:.35,roughness:.48})};function cube(parent,w,h,d,x,y,z,mat){let m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}function cyl(parent,r1,r2,h,x,y,z,mat,n=12){let m=new T.Mesh(new T.CylinderGeometry(r1,r2,h,n),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}cube(scene,28,.55,22,0,-.34,0,mats.edge);cube(scene,27.8,.12,21.8,0,-.025,0,mats.ground);let gridPoints=[];for(let x=-13;x<=13;x++){gridPoints.push(x,.044,-10.9,x,.044,10.9)}for(let z=-10;z<=10;z++){gridPoints.push(-13.9,.044,z,13.9,.044,z)}const gg=new T.BufferGeometry();gg.setAttribute('position',new T.Float32BufferAttribute(gridPoints,3));scene.add(new T.LineSegments(gg,mats.grid));const obstacles=[];function wall(x,z,w,d,h){cube(scene,w,h,d,x,h/2,z,mats.stone);cube(scene,w+.08,.12,d+.08,x,h+.04,z,mats.stoneDark);obstacles.push({x,z,w,d})}wall(-2.3,-.3,2.3,.65,2.2);wall(.5,-2.2,3.2,.55,1.35);wall(2.2,1.3,.55,3,2.4);wall(-5,1.4,1.25,1.25,1.1);wall(5,-1.1,1.3,1.3,1.2);wall(-9,-3.5,2.6,.65,1.6);wall(9,3.5,2.6,.65,1.6);wall(-8,5,1.4,1.4,1.25);wall(8,-5,1.4,1.4,1.25);wall(0,5.2,3,.55,1.15);wall(0,-5.2,3,.55,1.15);for(let i=0;i<13;i++){const x=-12+i*2;cube(scene,.5,.1,.45,x,.025,-10.65,mats.stoneDark);cube(scene,.5,.1,.45,x,.025,10.65,mats.stoneDark)}
const units=[];function soldier(team,x,z,id){const g=new T.Group(),armor=team===0?mats.blue:mats.red;cyl(g,.48,.53,.14,0,.08,0,mats.base,24);cyl(g,.4,.44,.07,0,.19,0,mats.stoneDark,24);for(const side of [-1,1]){cube(g,.23,.57,.3,side*.2,.51,.01,armor);cube(g,.28,.18,.35,side*.2,.26,-.04,mats.metal);cube(g,.32,.32,.4,side*.49,1.12,0,armor);cube(g,.22,.48,.26,side*.46,.85,-.02,armor)}cube(g,.7,.73,.45,0,1.04,0,armor);cube(g,.56,.25,.49,0,1.44,0,mats.gold);cube(g,.48,.53,.26,0,1.1,.34,mats.metal);cube(g,.37,.39,.37,0,1.69,0,armor);cube(g,.31,.12,.055,0,1.72,-.2,mats.visor);cube(g,.35,.58,.2,0,1.07,.37,mats.metal);cube(g,.19,.18,1.06,.22,1.06,-.52,mats.metal);cube(g,.12,.12,.34,.22,1.06,-1.14,mats.gold);cube(g,.46,.58,.28,0,1.05,.43,mats.metal);const ring=new T.Mesh(new T.TorusGeometry(.55,.045,8,28),new T.MeshBasicMaterial({color:0xf6d36c}));ring.rotation.x=Math.PI/2;ring.position.y=.11;ring.visible=false;g.add(ring);g.position.set(x,0,z);g.userData={team,id,x,z,moved:false,ring};scene.add(g);units.push(g)}for(let i=0;i<5;i++){soldier(0,-8+i*4,9,`A${i+1}`);soldier(1,-8+i*4,-9,`R${i+1}`)}
let turn=0,selected=null,theta=.28,phi=.83,dist=38;const target=new T.Vector3(0,.25,0);function cam(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}cam();const ray=new T.Raycaster(),pointer=new T.Vector2(),plane=new T.Plane(new T.Vector3(0,1,0),0),msg=document.getElementById('message');function say(t){msg.textContent=t}function select(u){if(selected)selected.userData.ring.visible=false;selected=u;if(u)u.userData.ring.visible=true}function pick(cx,cy){pointer.set(cx/innerWidth*2-1,-cy/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(units,true);if(hits.length){let u=hits[0].object;while(u.parent&&!u.userData.id)u=u.parent;if(u.userData.team!==turn){say('Esa miniatura pertenece al otro ejército.');return}select(u);say(`${u.userData.id} seleccionada. Toca una posición libre (máximo 4 casillas).`);return}if(!selected)return;const p=new T.Vector3();if(!ray.ray.intersectPlane(plane,p))return;const x=Math.round(p.x),z=Math.round(p.z),a=selected.userData;if(Math.abs(x)>13||Math.abs(z)>10){say('Posición fuera del tablero.');return}if(a.moved){say('Esta miniatura ya se movió durante este turno.');return}if(Math.hypot(x-a.x,z-a.z)>4){say('Distancia máxima: 4 casillas.');return}if(units.some(u=>u!==selected&&Math.hypot(u.position.x-x,u.position.z-z)<.9)||obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.48&&Math.abs(z-o.z)<o.d/2+.48)){say('Esa posición está ocupada.');return}selected.position.set(x,0,z);a.x=x;a.z=z;a.moved=true;say(`${a.id} se movió. Selecciona otra miniatura o termina el turno.`);select(null)}
const points=new Map();let start=null,drag=false,lastPinch=null;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){start={x:e.clientX,y:e.clientY};drag=false}else{drag=true;lastPinch=null}});canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const prev=points.get(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>7)drag=true;if(drag){theta-=(e.clientX-prev.x)*.009;phi=Math.max(.28,Math.min(1.38,phi+(e.clientY-prev.y)*.007));cam()}}else if(points.size===2){drag=true;const a=[...points.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)dist=Math.max(15,Math.min(58,dist*lastPinch/Math.max(1,d)));lastPinch=d;cam()}});canvas.addEventListener('pointerup',e=>{if(points.size===1&&!drag)pick(e.clientX,e.clientY);points.delete(e.pointerId);lastPinch=null});canvas.addEventListener('pointercancel',e=>{points.delete(e.pointerId);lastPinch=null});canvas.addEventListener('wheel',e=>{dist=Math.max(15,Math.min(58,dist+e.deltaY*.02));cam()},{passive:true});document.getElementById('end').onclick=()=>{turn=1-turn;select(null);units.filter(u=>u.userData.team===turn).forEach(u=>u.userData.moved=false);document.getElementById('turn').textContent='Turno: '+(turn?'Rojo':'Azul');say('Turno del ejército '+(turn?'rojo':'azul')+'. Selecciona una miniatura.')};document.getElementById('reset').onclick=()=>location.reload();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loading.style.display='none';renderer.setAnimationLoop(()=>renderer.render(scene,camera))}
})();</script></body></html>
