<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mesa Táctica v0.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101922;color:#f4f7fa;font-family:system-ui,-apple-system,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}header span,.panel{background:#172836ed;border:1px solid #294253;border-radius:12px;padding:10px 12px;font-size:13px}#controls{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;gap:9px}button{flex:1;border:1px solid #66849a;border-radius:12px;padding:14px 8px;color:white;background:#294255;font-size:14px;font-weight:700}button:last-child{background:#177c74}#info{position:absolute;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:12px;right:12px;pointer-events:none;line-height:1.35}#help{color:#a9c3d2;font-size:11px;margin-top:5px}</style></head><body><canvas id="game"></canvas><header><span>⚔️ Mesa Táctica · v0.2</span><span id="turn">Turno: Azul</span></header><div id="info" class="panel"><div id="msg">Selecciona un soldado azul y después toca una posición libre.</div><div id="help">Arrastrar: girar tablero · Dos dedos: zoom · Tocar: seleccionar y mover</div></div><div id="controls"><button id="reset">Reiniciar</button><button id="end">Terminar turno</button></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),msg=document.getElementById('msg');let W,H,dpr,angle=-.53,scale=1,turn=0,selected=null,units=[],touches=new Map(),start=null,drag=false,lastPinch=null;const ruins=[{x:-2,z:0,w:2,d:.7,h:2.2},{x:2,z:1.5,w:.7,d:3,h:2.5},{x:0,z:-2.5,w:3,d:.7,h:1.5},{x:5,z:-.8,w:1.4,d:1.4,h:1.3},{x:-5,z:2,w:1.4,d:1.4,h:1.3}];function reset(){units=[];for(let i=0;i<5;i++){units.push({x:-6+i*2,z:5,team:0,id:'A'+(i+1),moved:false});units.push({x:-6+i*2,z:-5,team:1,id:'R'+(i+1),moved:false})}turn=0;selected=null;document.getElementById('turn').textContent='Turno: Azul';say('Selecciona un soldado azul y después toca una posición libre.');draw()}function say(t){msg.textContent=t}function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function unitScale(){return Math.min(W/25,H/30)*scale}function project(x,z,y=0){const s=unitScale(),a=x*Math.cos(angle)-z*Math.sin(angle),b=x*Math.sin(angle)+z*Math.cos(angle);return {x:W/2+a*s,y:H*.47+b*s*.55-y*s}}function poly(pts,fill,stroke='#172a34',width=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function box(x,z,w,d,h,color){const p=(a,b,c)=>project(a,b,c),x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2;poly([p(x0,z0),p(x1,z0),p(x1,z0,h),p(x0,z0,h)],'#50565c');poly([p(x1,z0),p(x1,z1),p(x1,z1,h),p(x1,z0,h)],'#454b50');poly([p(x0,z0,h),p(x1,z0,h),p(x1,z1,h),p(x0,z1,h)],color)}function soldier(u){const p=project(u.x,u.z),s=unitScale(),c=u.team?'#d55d51':'#3f9be1',dark='#1b2d38';ctx.save();ctx.translate(p.x,p.y);ctx.scale(s/18,s/18);ctx.fillStyle='#10242e';ctx.beginPath();ctx.ellipse(0,0,11,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=selected===u?'#ffdb6e':u.moved?'#9da8b1':'#c5d4db';ctx.beginPath();ctx.ellipse(0,-2,10,4.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=dark;ctx.fillRect(-5,-18,4,14);ctx.fillRect(1,-18,4,14);ctx.fillStyle=c;ctx.fillRect(-7,-36,14,18);ctx.fillRect(-12,-34,5,13);ctx.fillRect(7,-34,5,13);ctx.fillStyle='#263c4a';ctx.fillRect(-6,-42,12,9);ctx.fillStyle=c;ctx.fillRect(-5,-43,10,8);ctx.fillStyle='#95e8ff';ctx.fillRect(-4,-39,8,2);ctx.fillStyle=dark;ctx.fillRect(4,-29,19,5);ctx.fillStyle='#a9b8bd';ctx.fillRect(18,-28,8,2);ctx.restore();if(selected===u){ctx.strokeStyle='#ffe17a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,unitScale()*.7,unitScale()*.38,0,0,Math.PI*2);ctx.stroke()}}function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#14232e');bg.addColorStop(1,'#0c141c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);poly([project(-9,-7),project(9,-7),project(9,7),project(-9,7)],'#526458','#273b37',3);for(let x=-9;x<=9;x++)line(project(x,-7),project(x,7),'#73877755');for(let z=-7;z<=7;z++)line(project(-9,z),project(9,z),'#73877755');const objs=[...ruins.map(r=>({z:r.x*Math.sin(angle)+r.z*Math.cos(angle),render:()=>box(r.x,r.z,r.w,r.d,r.h,'#8e9189')})),...units.map(u=>({z:u.x*Math.sin(angle)+u.z*Math.cos(angle),render:()=>soldier(u)}))];objs.sort((a,b)=>a.z-b.z).forEach(o=>o.render());ctx.fillStyle='#a8c2c9';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('PROTOTIPO SIN CONEXIÓN · TABLERO ISOMÉTRICO',W/2,Math.max(75,H*.14))}function unproject(px,py){const s=unitScale(),a=(px-W/2)/s,b=(py-H*.47)/(s*.55);return {x:a*Math.cos(angle)+b*Math.sin(angle),z:-a*Math.sin(angle)+b*Math.cos(angle)}}function pick(px,py){const near=units.map(u=>({u,p:project(u.x,u.z)})).filter(o=>Math.hypot(o.p.x-px,o.p.y-py)<unitScale()*1.1).sort((a,b)=>Math.hypot(a.p.x-px,a.p.y-py)-Math.hypot(b.p.x-px,b.p.y-py))[0];if(near){if(near.u.team===turn){selected=near.u;say('Seleccionado '+selected.id+'. Toca una casilla libre (máximo 4).')}else say('Es el turno del otro ejército.');draw();return}if(!selected)return;const v=unproject(px,py),x=Math.round(v.x),z=Math.round(v.z),u=selected;if(Math.abs(x)>8||Math.abs(z)>6){say('Fuera del tablero.');return}if(u.moved){say('Esta miniatura ya se movió en este turno.');return}if(Math.hypot(x-u.x,z-u.z)>4){say('Movimiento máximo: 4 casillas.');return}if(units.some(o=>o!==u&&Math.hypot(o.x-x,o.z-z)<.9)||ruins.some(o=>Math.abs(x-o.x)<o.w/2+.5&&Math.abs(z-o.z)<o.d/2+.5)){say('Posición ocupada.');return}u.x=x;u.z=z;u.moved=true;selected=null;say(u.id+' movida. Selecciona otra miniatura.');draw()}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){start={x:e.clientX,y:e.clientY};drag=false}else{drag=true;lastPinch=null}});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>9)drag=true;if(drag){angle+=(e.clientX-prev.x)*.008;draw()}}else if(touches.size===2){const a=[...touches.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)scale=Math.max(.6,Math.min(2.2,scale*dist/lastPinch));lastPinch=dist;draw()}});canvas.addEventListener('pointerup',e=>{if(touches.size===1&&!drag)pick(e.clientX,e.clientY);touches.delete(e.pointerId);lastPinch=null});canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));canvas.addEventListener('wheel',e=>{scale=Math.max(.6,Math.min(2.2,scale*(e.deltaY>0?.9:1.1)));draw()},{passive:true});document.getElementById('reset').onclick=reset;document.getElementById('end').onclick=()=>{turn=1-turn;selected=null;units.filter(u=>u.team===turn).forEach(u=>u.moved=false);document.getElementById('turn').textContent='Turno: '+(turn?'Rojo':'Azul');say('Turno del ejército '+(turn?'rojo':'azul')+'. Selecciona una miniatura.');draw()};addEventListener('resize',resize);resize();reset()})();
</script></body></html>
